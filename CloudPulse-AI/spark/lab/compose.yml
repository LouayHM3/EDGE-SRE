name: cloudpulse-lab

x-hadoop: &hadoop
  image: apache/hadoop:3.4.2
  user: root
  environment:
    HADOOP_CONF_DIR: /lab-conf
    HADOOP_NAMENODE_OPTS: -Xmx512m
    HADOOP_DATANODE_OPTS: -Xmx384m
  volumes:
    - .:/lab-conf:ro
    - ../../data/raw/metrics:/input:ro
  entrypoint: ["/bin/bash", "-ec"]

x-spark: &spark
  image: cloudpulse-cluster:local
  entrypoint: ["/bin/sh", "-ec"]
  environment:
    HADOOP_CONF_DIR: /lab-conf
    SPARK_DAEMON_MEMORY: 512m
  volumes:
    - ../..:/workspace:ro
    - .:/lab-conf:ro
  mem_limit: 2300m

services:
  namenode:
    <<: *hadoop
    hostname: namenode
    volumes:
      - .:/lab-conf:ro
      - ../../data/raw/metrics:/input:ro
      - namenode-data:/hdfs/name
    command:
      - |
        mkdir -p /hdfs/name
        if [ ! -f /hdfs/name/current/VERSION ]; then hdfs namenode -format -nonInteractive; fi
        exec hdfs namenode
  datanode-a:
    <<: *hadoop
    hostname: datanode-a
    volumes:
      - .:/lab-conf:ro
      - datanode-a-data:/hdfs/data
    depends_on: [namenode]
    command: ["mkdir -p /hdfs/data; exec hdfs datanode"]
  datanode-b:
    <<: *hadoop
    hostname: datanode-b
    volumes:
      - .:/lab-conf:ro
      - datanode-b-data:/hdfs/data
    depends_on: [namenode]
    command: ["mkdir -p /hdfs/data; exec hdfs datanode"]
  master:
    <<: *spark
    hostname: master
    mem_limit: 800m
    command: ['exec "$$SPARK_HOME/bin/spark-class" org.apache.spark.deploy.master.Master --host master']
  worker-a:
    <<: *spark
    hostname: worker-a
    depends_on: [master]
    command: ['exec "$$SPARK_HOME/bin/spark-class" org.apache.spark.deploy.worker.Worker --host worker-a --cores 1 --memory 768m spark://master:7077']
  worker-b:
    <<: *spark
    hostname: worker-b
    depends_on: [master]
    command: ['exec "$$SPARK_HOME/bin/spark-class" org.apache.spark.deploy.worker.Worker --host worker-b --cores 1 --memory 768m spark://master:7077']
  driver:
    <<: *spark
    profiles: [jobs]
    hostname: driver
    depends_on: [master, worker-a, worker-b, namenode, datanode-a, datanode-b]
    environment:
      HADOOP_CONF_DIR: /lab-conf
      PYSPARK_SUBMIT_ARGS: >-
        --conf spark.executor.memory=768m
        --conf spark.executor.cores=1
        --conf spark.cores.max=2
        --conf spark.driver.host=driver
        --conf spark.driver.bindAddress=0.0.0.0
        pyspark-shell
    build:
      context: ../..
      dockerfile: spark/lab/Dockerfile
      additional_contexts:
        spark_source: ../../.venv/tools/pyspark-4.1.3

volumes:
  namenode-data:
  datanode-a-data:
  datanode-b-data:
