[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-sre"
version = "0.1.0"
description = "Offline-first site reliability engineering agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "psutil>=5.9",
  "fastapi>=0.110",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["backend"]
